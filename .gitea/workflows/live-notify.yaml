name: Client tests and live Notify integration

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test current client and real Notify API
        env:
          NOTIFY_TEST_APIKEY: ${{ secrets.NOTIFY_TEST_APIKEY }}
          NOTIFY_TEST_APISECRET: ${{ secrets.NOTIFY_TEST_APISECRET }}
          NOTIFY_TEST_RUN_ID: ${{ gitea.run_id }}
        run: |
          set -eu
          tar -cf - pyproject.toml README.md atyx_notify_client tests .gitea/scripts |
            docker run --rm -i \
              -e NOTIFY_TEST_APIKEY -e NOTIFY_TEST_APISECRET -e NOTIFY_TEST_RUN_ID \
              python:3.12-slim sh -c '
                set -eu
                mkdir -p /app
                tar -xf - -C /app
                cd /app
                pip install --disable-pip-version-check --no-cache-dir ".[dev]"
                python -m pytest -q
                python .gitea/scripts/test-live-notify.py
              '

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Send ATYX notification (success)
        uses: https://github.com/wx-ast/atyx_notify@96f39e9bbe5a8915576f8a14e7f8f50bc0ac3a19
        if: needs.test.result == 'success'
        env:
          NOTIFY_BASEURL: https://notify.atyx.ru/notify/
          API_KEY: ${{ secrets.ATYX_API_KEY }}
          API_SECRET: ${{ secrets.ATYX_API_SECRET }}
          MESSAGE: |
            🚀 [atyx_notify_client](${{ gitea.server_url }}/${{ gitea.repository }}): Сборка завершена ✅

            ✅ [Успешно](${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}) 🌿 ${{ gitea.ref_name }}
            📝 [${{ gitea.sha }}](${{ gitea.server_url }}/${{ gitea.repository }}/commit/${{ gitea.sha }})
            💬 ${{ gitea.event.head_commit.message }}
      - name: Send ATYX notification (failure)
        uses: https://github.com/wx-ast/atyx_notify@96f39e9bbe5a8915576f8a14e7f8f50bc0ac3a19
        if: needs.test.result != 'success'
        env:
          NOTIFY_BASEURL: https://notify.atyx.ru/notify/
          API_KEY: ${{ secrets.ATYX_API_KEY }}
          API_SECRET: ${{ secrets.ATYX_API_SECRET }}
          MESSAGE: |
            🚀 [atyx_notify_client](${{ gitea.server_url }}/${{ gitea.repository }}): Сборка завершилась с ошибкой ❌

            ❌ [Ошибка](${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}) 🌿 ${{ gitea.ref_name }}
            📝 [${{ gitea.sha }}](${{ gitea.server_url }}/${{ gitea.repository }}/commit/${{ gitea.sha }})
            💬 ${{ gitea.event.head_commit.message }}
